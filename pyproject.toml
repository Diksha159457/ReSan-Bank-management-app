[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["B008"]  # FastAPI's File(...) defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"main.py" = ["S104"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
